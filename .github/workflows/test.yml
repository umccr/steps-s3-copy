name: Test

on:
  push:
    branches: [main]
    paths:
      - "packages/steps-s3-copy/docker/copy-batch-docker-image/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "packages/steps-s3-copy/docker/copy-batch-docker-image/**"
      - ".github/workflows/test.yml"

jobs:
  copy-batch-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/steps-s3-copy/docker/copy-batch-docker-image/integration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/steps-s3-copy/docker/copy-batch-docker-image/integration/go.mod
          cache-dependency-path: packages/steps-s3-copy/docker/copy-batch-docker-image/integration/go.sum
      - run: go test -tags integration -v ./...
        env:
          DOCKER_BUILDKIT: "1"
